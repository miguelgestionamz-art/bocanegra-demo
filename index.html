        const menuData = [

            { id:5, title:"Tartar de Atún Rojo", price:"22.00€", description:"Base de aguacate y aliño de soja con emulsión de wasabi ligero.", category:"principales" },

        ];

        const menuGrid = document.getElementById('menu-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderMenu(category = 'all') {
            menuGrid.innerHTML = '';
            const filteredData = category === 'all' ? menuData : menuData.filter(item => item.category === category);
            filteredData.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <div class="item-header">
                        <h3 class="item-title">${item.title}</h3>
                        <span class="item-price">${item.price}</span>
                    </div>
                    <p class="item-desc">${item.description}</p>`;
                menuGrid.appendChild(menuItem);
            });
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const category = btn.getAttribute('data-filter');
                menuGrid.style.opacity = '0';
                setTimeout(() => {
                    renderMenu(category);
                    menuGrid.style.opacity = '1';
                    menuGrid.style.transition = 'opacity 0.4s ease';
                }, 200);
            });
        });

        renderMenu();

        // --- AI Chat Logic ---
        const chatToggle = document.getElementById('chat-toggle');
        const chatWrapper = document.getElementById('chat-wrapper');
        const chatClose = document.getElementById('chat-close');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatBody = document.getElementById('chat-body');
        let history = [];
        let chatStarted = false;

        chatToggle.addEventListener('click', () => {
            chatWrapper.classList.toggle('hidden');
            chatToggle.classList.remove('pulse');
            if (!chatWrapper.classList.contains('hidden')) {
                if (!chatStarted) { chatStarted = true; initChat(); }
                chatInput.focus();
            }
        });

        chatClose.addEventListener('click', () => {
            chatWrapper.classList.add('hidden');
        });

        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msgDiv.innerHTML = `<div class="bubble"><p>${text.replace(/\n/g,'<br>')}</p></div>`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping() {
            const d = document.createElement('div');
            d.className = 'message ai-message'; d.id = 'typing';
            d.innerHTML = '<div class="bubble"><span style="opacity:.5">· · ·</span></div>';
            chatBody.appendChild(d);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        async function callOpenAI(userMsg) {
            if (userMsg) {
                history.push({ role: 'user', content: userMsg });
                addMessage(userMsg, true);
                chatInput.value = '';
            }
            chatSend.disabled = true;
            showTyping();
            try {
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o',
                        max_tokens: 500,
                        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history]
                    })
                });
                const data = await res.json();
                removeTyping();
                const reply = data.choices?.[0]?.message?.content || 'Lo siento, ha habido un error. Llámanos: 604 94 74 26';
                history.push({ role: 'assistant', content: reply });
                addMessage(reply);
            } catch (e) {
                removeTyping();
                addMessage('Sin conexión en este momento. Puedes llamarnos: 604 94 74 26 🙏');
            }
            chatSend.disabled = false;
        }

        function initChat() { callOpenAI(null); }

        function handleChat() {
            const text = chatInput.value.trim();
            if (!text || chatSend.disabled) return;
            callOpenAI(text);
        }

        chatSend.addEventListener('click', handleChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
    </script>
